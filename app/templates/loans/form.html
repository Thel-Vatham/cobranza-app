{% extends "base.html" %}
{% block title %}Nuevo préstamo · Cartera{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Nuevo préstamo</h1>
    <p class="muted">Configuración de valor, cuotas y fecha de inicio · La tasa de interés se fija en Parámetros</p>
  </div>
  <a class="btn" href="{{ url_for('loans.list_loans') }}">← Volver</a>
</header>

<form class="card form" method="post">
  <div class="grid grid-3">
    <label class="span-3">Cliente *
      <select name="client_id" required>
        <option value="">Seleccione un cliente…</option>
        {% for c in clients %}
        <option value="{{ c.id }}" {% if request.args.get('client_id') == c.id|string %}selected{% endif %}>{{ c.full_name }} ({{ c.identification_number }})</option>
        {% endfor %}
      </select>
    </label>
    <label>Valor principal *
      <input type="number" step="0.01" min="0" name="principal" required placeholder="1000000">
    </label>
    <label>Tasa de interés por cuota (fija)
      <input type="text" value="{{ tasa_actual }}% por cuota" readonly style="background: var(--bg); color: var(--text-soft); cursor: not-allowed; border-color: var(--border);">
      <small class="muted" style="font-size: 0.78rem;">
        Se aplica <strong>{{ tasa_actual }}%</strong> sobre el saldo en cada cuota.
        Configurable en <a href="{{ url_for('admin.parameters') }}" style="color: var(--accent);">Parámetros del Sistema</a>.
      </small>
    </label>
    <label>Número de cuotas *
      <input type="number" min="1" name="installments_count" required value="12">
    </label>
    <label>Frecuencia de pago *
      <select name="frequency_days" required>
        <option value="15" selected>Quincenal (15 días)</option>
        <option value="30">Mensual (30 días)</option>
        <option value="7">Semanal (7 días)</option>
        <option value="1">Diario (1 día)</option>
      </select>
    </label>
    <label>Amortización *
      <select name="amortization_type" required>
        <option value="frances" selected>Francés (Cuota fija, Interés decr.)</option>
        <option value="aleman">Alemán (Capital fijo, Pago total decr.)</option>
      </select>
    </label>
    <label>Fecha de inicio *
      <input type="date" name="start_date" required>
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Generar obligaciones</button>
    <a class="btn" href="{{ url_for('loans.list_loans') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
