{% extends "base.html" %}
{% block title %}Iniciar sesión · Cartera{% endblock %}
{% from "_icons.html" import logo %}{% block auth %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="brand login-brand" style="justify-content: center; text-align: left; padding-bottom: 20px;">
      {{ logo(54) }}
      <div style="line-height: 1.2;">
        <strong style="font-size: 20px; font-weight: 800; letter-spacing: 0.03em; color: var(--text);">SOLUCIONES</strong>
        <small style="color: #b8860b; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px;">Financieras</small>
      </div>
    </div>
    <h1>Iniciar sesión</h1>
    <label>Usuario
      <input type="text" name="username" required autofocus placeholder="admin">
    </label>
    <label>Contraseña
      <input type="password" name="password" required placeholder="••••••••">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    <p class="hint" style="margin-top: 15px; font-size: 0.85rem; line-height: 1.4;">
      <strong>Credenciales de prueba:</strong><br>
      • <code>admin</code> / <code>09300</code> (Acceso Total)<br>
      • <code>user_0</code> / <code>09300</code> (Solo Gestión)
    </p>
  </form>
</div>
{% endblock %}
