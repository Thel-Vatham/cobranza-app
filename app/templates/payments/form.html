{% extends "base.html" %}
{% block title %}Registrar pago · Cartera{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Registrar pago</h1>
    <p class="muted">El valor se aplica automáticamente (interés primero, luego capital)</p>
  </div>
  <a class="btn" href="{{ url_for('payments.list_payments') }}">← Volver</a>
</header>

<form class="card form" method="post" enctype="multipart/form-data">
  <div class="grid grid-3">
    <label class="span-3">Préstamo / Cliente *
      <select name="loan_id" required>
        <option value="">Seleccione un préstamo…</option>
        {% for l in loans %}
        <option value="{{ l.id }}" {% if request.args.get('loan_id') == l.id|string %}selected{% endif %}>{{ l.code }} — {{ l.client.full_name }} (saldo {{ l.outstanding_balance|money }})</option>
        {% endfor %}
      </select>
    </label>
    <label>Valor recibido *
      <input type="number" step="0.01" min="0.01" name="amount" required placeholder="0.00">
    </label>
    <label>Fecha de recepción *
      <input type="date" name="payment_date" required>
    </label>
    <label>Concepto de aplicación
      <input type="text" name="concept" placeholder="Abono a préstamo">
    </label>
    <label>Número de recibo
      <input type="text" name="receipt_number" placeholder="Opcional">
    </label>
    <label class="span-3">Comprobante del pago (imagen o archivo)
      <input type="file" name="comprobante" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.doc,.docx,.xls,.xlsx,.txt,.csv">
      <small class="muted">Adjunte el soporte documental de este pago.</small>
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Aplicar pago</button>
    <a class="btn" href="{{ url_for('payments.list_payments') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
