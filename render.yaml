services:
  - type: web
    name: cartera
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -t 120 run:app"
    envVars:
      - key: AUTH_DISABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:////data/cartera.db"
      - key: UPLOAD_FOLDER
        value: "/data/uploads"
    disk:
      name: cartera-data
      mountPath: /data
      sizeGB: 1
